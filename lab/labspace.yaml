title: "Docker AI Governance"
description: >
  Define once, enforce everywhere. A hands-on, fully simulated lab proving how
  Docker AI Governance policies flow from the Admin Console to every developer's
  sbx sandbox — covering network, filesystem, and credential enforcement, the
  MCP Gateway, observability, and Sandbox Kits. Every command in the terminal is
  simulated, so it runs the same for everyone with nothing to install.

# Command behaviour lives in simulator.yaml (relative to this file).
simulator: simulator.yaml

# A single simulated host terminal. `sbx` and `curl` are scripted in simulator.yaml.
terminals:
  - id: host
    title: Terminal
    icon: terminal

# Seed the virtual filesystem. Built-in `ls`/`cat` reflect these immediately.
files:
  README.txt: |
    Docker AI Governance lab — simulated environment.
    Files created by scenarios and save-as blocks appear here too.

# Ordered instruction pages, rendered in the left-hand panel. Order mirrors the
# original ttyd lab so the narrative flows the same.
sections:
  - title: Setup
    contentPath: 00-setup.md
  - title: Why AI Governance
    contentPath: 01-introduction.md
  - title: The Problem Statement
    contentPath: 15-problem-statement.md
  - title: Sandboxing the Agent
    contentPath: 16-sandboxing-the-agent.md
  - title: The Policy Model
    contentPath: 02-the-policy-model.md
  - title: Network Enforcement Demo
    contentPath: 03-network-demo.md
  - title: Filesystem Enforcement Demo
    contentPath: 04-filesystem-demo.md
  - title: Credential Isolation
    contentPath: 12-credential-isolation.md
  - title: Product Catalog
    contentPath: 07-product-catalog.md
  - title: MCP Hands-On
    contentPath: 06-mcp-hands-on.md
  - title: Sandbox Kits
    contentPath: 14-sandbox-kits.md
  - title: "Kits: Introduction"
    contentPath: kits/01-intro.md
  - title: "Kits: Your First Mixin"
    contentPath: kits/02-first-mixin.md
  - title: "Kits: Network & Credentials"
    contentPath: kits/03-network-and-creds.md
  - title: "Kits: Fork an Agent Kit"
    contentPath: kits/04-agent-kit.md
  - title: "Kits: Stacking & Distribution"
    contentPath: kits/05-stacking-and-community.md
  - title: "Kits: Summary"
    contentPath: kits/06-summary.md
  - title: Putting It All Together
    contentPath: 13-end-to-end-governance.md
  - title: Observability
    contentPath: 08-observability.md
  - title: Monitoring Policies
    contentPath: 09-monitoring-policies.md
  - title: Audit Logging
    contentPath: 10-audit-logging.md
  - title: Governance API
    contentPath: 11-governance-api.md
  - title: What's Next
    contentPath: 05-whats-next.md

# $$name$$ substitution. `org` seeds a sensible placeholder the learner overrides
# via ::variableDefinition in Setup. `os`, `agent`, `setupMode`, etc. are left
# UNSET on purpose so their ::variableSetButton pickers and :::conditionalDisplay
# branches behave correctly (the "pick one" prompts show until a choice is made).
variables:
  org: my-org
